name = "problems"
version = "0.1.0"
keywords = ["math"]

[[lean_lib]]
name = "__output"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
maxRecDepth = 20000
linter.unusedVariables = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"
